name: Build WebDriverAgent IPA

on:
  workflow_dispatch:
    inputs:
      wda_tag:
        description: 'WebDriverAgent tag to build'
        required: false
        default: 'v16.15.3'
      xcode_version:
        description: 'Xcode version to build with (15.4 avoids the iOS<18 lib_TestingInterop crash)'
        required: false
        default: '15.4'
  push:
    branches: [main]

jobs:
  build:
    # macos-14 runners default to Xcode 15.4, whose XCTest has no Testing.framework
    # dependency -> avoids the iOS<18 lib_TestingInterop.dylib crash. (No extra
    # Xcode-select step needed; that also avoids third-party action issues on forks.)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          uname -a

      - name: Clone WebDriverAgent (pinned tag)
        run: |
          TAG="${{ github.event.inputs.wda_tag || 'v16.15.3' }}"
          echo "Building WDA $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/appium/WebDriverAgent.git
          cd WebDriverAgent
          echo "WDA Version: $(git describe --tags --always)"

      - name: Build WebDriverAgent (unsigned, for Sideloadly re-sign)
        run: |
          cd WebDriverAgent
          set -o pipefail
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            -allowProvisioningUpdates 2>&1 | tail -n 150

      - name: Find and Package App
        run: |
          cd WebDriverAgent
          APP_PATH=$(find ./build -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "!! App not found. Build products:"
            find ./build -name "*.app" -type d
            echo "=== any xcbuild logs ==="
            find ./build -name "*.xcactivitylog" | head
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

      - name: Defensive fix - embed lib_TestingInterop.dylib if referenced
        # Safeguard for any Xcode >= 16 build: the app may link Testing.framework which
        # needs lib_TestingInterop.dylib at runtime on iOS < 18. Copy it from the SDK so
        # dyld can resolve it. On Xcode 15.4 this file does not exist in the SDK, so it's a no-op.
        run: |
          cd WebDriverAgent
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          DST="Payload/WebDriverAgentRunner-Runner.app/Frameworks"
          for p in "$SDK/usr/lib/swift/lib_TestingInterop.dylib" "$SDK/usr/lib/lib_TestingInterop.dylib"; do
            if [ -f "$p" ]; then
              cp "$p" "$DST/"
              echo "Embedded $p -> $DST/"
              break
            fi
          done
          # Sanity: fail the build early if the app still references a missing dylib
          if grep -rl "lib_TestingInterop" "Payload/WebDriverAgentRunner-Runner.app" >/dev/null 2>&1; then
            if [ ! -f "$DST/lib_TestingInterop.dylib" ]; then
              echo "!! lib_TestingInterop referenced but NOT embedded - build will crash on iOS<18"
              exit 1
            fi
          fi

      - name: Zip IPA (unsigned)
        run: |
          cd WebDriverAgent
          rm -f WebDriverAgent.ipa
          zip -r WebDriverAgent.ipa Payload
          ls -la WebDriverAgent.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-IPA
          path: WebDriverAgent/WebDriverAgent.ipa
          retention-days: 30
