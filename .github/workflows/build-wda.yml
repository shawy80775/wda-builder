name: Build WebDriverAgent IPA

on:
  workflow_dispatch:
    inputs:
      wda_tag:
        description: 'WebDriverAgent tag to build'
        required: false
        default: 'v16.15.3'
  push:
    branches: [main]

jobs:
  build:
    # macos-latest is the only runner reliably available on this account.
    # It now ships a very new Xcode (>=16) whose XCTest embeds Testing.framework,
    # which at launch references @rpath/lib_TestingInterop.dylib -- a library that
    # does NOT exist on iOS < 18, so WDA dies with a dyld SIGABRT.
    # Fix: delete Testing.framework from the built app bundle before packaging.
    # WDA does not use Swift Testing, so removing it is safe and lets WDA launch
    # cleanly on iOS 16/17.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Clone WebDriverAgent (pinned tag)
        run: |
          TAG="${{ github.event.inputs.wda_tag || 'v16.15.3' }}"
          echo "Building WDA $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/appium/WebDriverAgent.git
          cd WebDriverAgent
          echo "WDA Version: $(git describe --tags --always)"

      - name: Build WebDriverAgent (unsigned, for Sideloadly re-sign)
        run: |
          cd WebDriverAgent
          set -o pipefail
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            -allowProvisioningUpdates 2>&1 | tail -n 150

      - name: Find and Package App
        run: |
          cd WebDriverAgent
          APP_PATH=$(find ./build -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "!! App not found. Build products:"
            find ./build -name "*.app" -type d
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

      - name: Remove Testing.framework (fix iOS<18 launch crash)
        # Xcode>=16 embeds Testing.framework which needs lib_TestingInterop.dylib
        # (absent on iOS<18). WDA never uses Swift Testing, so delete it from the
        # bundle so dyld won't try to load it at launch.
        run: |
          cd WebDriverAgent
          APP="Payload/WebDriverAgentRunner-Runner.app"
          TF="$APP/Frameworks/Testing.framework"
          if [ -d "$TF" ]; then
            echo "Testing.framework present -> removing it"
            rm -rf "$TF"
            echo "Removed $TF"
          else
            echo "No Testing.framework in bundle (Xcode<16 build) -> nothing to remove"
          fi
          echo "=== remaining frameworks ==="
          ls -1 "$APP/Frameworks" 2>/dev/null || echo "(no Frameworks dir)"
          echo "=== sanity: any leftover reference to lib_TestingInterop? ==="
          if grep -rl "lib_TestingInterop" "$APP" >/dev/null 2>&1; then
            echo "!! still references lib_TestingInterop -- build will crash"
            exit 1
          else
            echo "OK: no lib_TestingInterop reference in app bundle"
          fi

      - name: Zip IPA (unsigned)
        run: |
          cd WebDriverAgent
          rm -f WebDriverAgent.ipa
          zip -r WebDriverAgent.ipa Payload
          ls -la WebDriverAgent.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-IPA
          path: WebDriverAgent/WebDriverAgent.ipa
          retention-days: 30
