name: Build WebDriverAgent IPA

on:
  workflow_dispatch:
    inputs:
      wda_tag:
        description: 'WebDriverAgent tag to build'
        required: false
        default: 'v16.15.3'
  push:
    branches: [main]

jobs:
  build:
    # macos-13 ships Xcode 15.x. Xcode 15's XCTest does NOT link Testing.framework,
    # so there is no lib_TestingInterop.dylib dependency -> WDA runs fine on iOS 16/17.
    # (macos-latest is now Xcode 26.6 which reintroduces the iOS<18 crash; macos-14 is
    #  unavailable on this account, so we use macos-13.)
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Clone WebDriverAgent (pinned tag)
        run: |
          TAG="${{ github.event.inputs.wda_tag || 'v16.15.3' }}"
          echo "Building WDA $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/appium/WebDriverAgent.git
          cd WebDriverAgent
          echo "WDA Version: $(git describe --tags --always)"

      - name: Build WebDriverAgent (unsigned, for Sideloadly re-sign)
        run: |
          cd WebDriverAgent
          set -o pipefail
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            -allowProvisioningUpdates 2>&1 | tail -n 150

      - name: Find and Package App
        run: |
          cd WebDriverAgent
          APP_PATH=$(find ./build -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "!! App not found. Build products:"
            find ./build -name "*.app" -type d
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

      - name: Embed lib_TestingInterop.dylib if needed (Xcode>=16 safeguard)
        # Only relevant when the bundle references it (Xcode>=16). On Xcode 15 there is
        # nothing to embed. If it IS referenced but the dylib can't be found, fail loudly.
        run: |
          cd WebDriverAgent
          DST="Payload/WebDriverAgentRunner-Runner.app/Frameworks"
          if grep -rl "lib_TestingInterop" "Payload/WebDriverAgentRunner-Runner.app" >/dev/null 2>&1; then
            echo "Testing.framework present -> embedding lib_TestingInterop.dylib"
            SDK=$(xcrun --sdk iphoneos --show-sdk-path)
            LIB=$(find /Applications/Xcode.app "$SDK" -name "lib_TestingInterop.dylib" 2>/dev/null | head -1)
            if [ -n "$LIB" ]; then
              cp "$LIB" "$DST/"
              echo "Embedded $LIB"
            else
              echo "!! lib_TestingInterop.dylib missing on this Xcode; cannot fix"
              exit 1
            fi
          else
            echo "No lib_TestingInterop reference -> Xcode 15 build, nothing to embed"
          fi

      - name: Zip IPA (unsigned)
        run: |
          cd WebDriverAgent
          rm -f WebDriverAgent.ipa
          zip -r WebDriverAgent.ipa Payload
          ls -la WebDriverAgent.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-IPA
          path: WebDriverAgent/WebDriverAgent.ipa
          retention-days: 30
