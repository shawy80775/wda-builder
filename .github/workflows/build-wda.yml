name: Build WebDriverAgent IPA

on:
  workflow_dispatch:
    inputs:
      wda_tag:
        description: 'WebDriverAgent tag to build'
        required: false
        default: 'v16.15.3'
  push:
    branches: [main]

jobs:
  build:
    # macos-latest is the only runner reliably available on this account (currently Xcode 26).
    # Xcode 26's XCTest embeds a reference to @rpath/lib_TestingInterop.dylib, which does NOT
    # exist on iOS < 18 -> WDA dies with a dyld SIGABRT at launch.
    # Fix: drop Testing.framework (WDA never uses Swift Testing) and ship a stub
    # lib_TestingInterop.dylib so dyld can resolve the reference on iOS 16/17.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Clone WebDriverAgent (pinned tag)
        run: |
          TAG="${{ github.event.inputs.wda_tag || 'v16.15.3' }}"
          echo "Building WDA $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/appium/WebDriverAgent.git
          cd WebDriverAgent
          echo "WDA Version: $(git describe --tags --always)"

      - name: Build WebDriverAgent (unsigned, for Sideloadly re-sign)
        run: |
          cd WebDriverAgent
          set -o pipefail
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            -allowProvisioningUpdates 2>&1 | tail -n 150

      - name: Find and Package App
        run: |
          cd WebDriverAgent
          APP_PATH=$(find ./build -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "!! App not found. Build products:"
            find ./build -name "*.app" -type d
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

      - name: Fix lib_TestingInterop.dylib (iOS<18 launch crash)
        run: |
          cd WebDriverAgent
          APP="Payload/WebDriverAgentRunner-Runner.app"
          DST="$APP/Frameworks"
          mkdir -p "$DST"

          # 1) Remove Testing.framework (its binary needs the dylib; WDA doesn't use Swift Testing)
          if [ -d "$DST/Testing.framework" ]; then
            rm -rf "$DST/Testing.framework"
            echo "removed Testing.framework"
          else
            echo "no Testing.framework in bundle"
          fi

          # 2) Provide lib_TestingInterop.dylib at @rpath so dyld can resolve the reference.
          #    Prefer the real dylib if present on the build host (macOS SDK often has it);
          #    otherwise compile a tiny stub that satisfies the load.
          LIB=$(find /Applications/Xcode.app -name "lib_TestingInterop.dylib" 2>/dev/null | head -1)
          if [ -n "$LIB" ]; then
            cp "$LIB" "$DST/"
            echo "copied real dylib from $LIB"
          else
            echo "real dylib not found on host -> building stub"
            SDK=$(xcrun --sdk iphoneos --show-sdk-path)
            echo 'void _wda_testing_interop_stub(void){}' > /tmp/wda_stub.c
            clang -dynamiclib -arch arm64 \
              -isysroot "$SDK" -mios-version-min=16.0 \
              -install_name @rpath/lib_TestingInterop.dylib \
              -o "$DST/lib_TestingInterop.dylib" /tmp/wda_stub.c
          fi
          echo "=== dylib in bundle ==="
          ls -la "$DST/lib_TestingInterop.dylib"

          # 3) Sanity: the dylib must physically exist in the bundle
          if [ -f "$DST/lib_TestingInterop.dylib" ]; then
            echo "OK: lib_TestingInterop.dylib present in Frameworks -> dyld will resolve it on iOS<18"
          else
            echo "!! lib_TestingInterop.dylib missing -> WDA will crash on iOS<18"
            exit 1
          fi

      - name: Zip IPA (unsigned)
        run: |
          cd WebDriverAgent
          rm -f WebDriverAgent.ipa
          zip -r WebDriverAgent.ipa Payload
          ls -la WebDriverAgent.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-IPA
          path: WebDriverAgent/WebDriverAgent.ipa
          retention-days: 30
