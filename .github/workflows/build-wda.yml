name: Build WebDriverAgent IPA

on:
  workflow_dispatch:
    inputs:
      wda_tag:
        description: 'WebDriverAgent tag to build'
        required: false
        default: 'v16.15.3'
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / environment
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          uname -a

      - name: Clone WebDriverAgent (pinned tag)
        run: |
          TAG="${{ github.event.inputs.wda_tag || 'v16.15.3' }}"
          echo "Building WDA $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/appium/WebDriverAgent.git
          cd WebDriverAgent
          echo "WDA Version: $(git describe --tags --always)"

      - name: Build WebDriverAgent (unsigned, for Sideloadly re-sign)
        run: |
          cd WebDriverAgent
          set -o pipefail
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            -allowProvisioningUpdates 2>&1 | tail -n 150

      - name: Find and Package App
        run: |
          cd WebDriverAgent
          APP_PATH=$(find ./build -name "WebDriverAgentRunner-Runner.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "!! App not found. Build products:"
            find ./build -name "*.app" -type d
            echo "=== any xcbuild logs ==="
            find ./build -name "*.xcactivitylog" | head
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r WebDriverAgent.ipa Payload
          ls -la WebDriverAgent.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-IPA
          path: WebDriverAgent/WebDriverAgent.ipa
          retention-days: 30
